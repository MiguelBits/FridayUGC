name: android-apk

# Builds an installable APK you download from the run's Artifacts.
# - Push to main / manual dispatch -> debug APK (unsigned-debug, installable for testing).
# - If signing secrets are set, also produces a signed release APK.

on:
  workflow_dispatch:
    inputs:
      brain_url:
        description: "Brain URL baked into the APK (e.g. http://1.2.3.4:8080)"
        required: true
        default: "http://10.0.2.2:8080"
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            -Pfriday.brainUrl="${{ github.event.inputs.brain_url || 'http://10.0.2.2:8080' }}" \
            -Pfriday.apiToken="${{ secrets.FRIDAY_API_TOKEN }}"

      - name: Decode keystore (optional signed release)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > friday-keystore.jks

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -Pfriday.brainUrl="${{ github.event.inputs.brain_url || 'http://10.0.2.2:8080' }}" \
            -Pfriday.apiToken="${{ secrets.FRIDAY_API_TOKEN }}" \
            -Pandroid.injected.signing.store.file=$PWD/friday-keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: friday-ugc-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
