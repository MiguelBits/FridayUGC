name: brain-ci

on:
  push:
    paths: ["brain/**", ".github/workflows/brain-ci.yml"]
  pull_request:
    paths: ["brain/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests (mock provider)
        env:
          FRIDAY_LLM_PROVIDER: mock
          FRIDAY_API_TOKEN: test-token
        run: pytest -q
